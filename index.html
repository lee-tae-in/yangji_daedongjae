<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 페이지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #ffe4ec; /* 배경 이미지 바깥 여백 색 (연핑크) */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ===== 배경 이미지 크기와 똑같은 무대 ===== */
    .stage {
      position: relative;
      width: 100%;             /* 화면이 이미지보다 작으면 비율 유지하며 줄어듦 */
      /* max-width, aspect-ratio 는 스크립트가 이미지 원본 크기로 자동 설정 */
      background-image: url("배경.png");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      overflow: hidden;        /* 오브젝트가 이미지 밖으로 안 나감 */
      display: flex;           /* 내용이 길면 배경도 같이 늘어남 */
      flex-direction: column;
    }

    /* ===== 떨어지는 오브젝트 ===== */
    .falling-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .item {
      position: absolute;
      top: -150px;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* --stage-h = 배경 이미지 높이 (스크립트가 자동 설정) */
    @keyframes fall {
      0%   { transform: translate(0, 0)                               rotate(0deg);   }
      25%  { transform: translate(20px,  calc(var(--stage-h) * 0.3))  rotate(90deg);  }
      50%  { transform: translate(-20px, calc(var(--stage-h) * 0.6))  rotate(180deg); }
      75%  { transform: translate(15px,  calc(var(--stage-h) * 0.9))  rotate(270deg); }
      100% { transform: translate(0,     calc(var(--stage-h) + 200px)) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .item { animation: none !important; }
    }

    /* ===== 본문 (배경 이미지 위에 표시) ===== */
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      flex: 1;                 /* 배경 높이만큼 채우기 (로고가 맨 아래로 가도록) */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;  /* 위에서부터 쌓기 (제목이 맨 위) */
      gap: 60px;
      padding: 0px 50px;      /* 양옆 마진 20px */
    }

    /* 본문 사진 */
    .content img {
      display: block;
      width: 100%;             /* 양옆 20px 빼고 꽉 차게 */
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      margin-top: 50px;
    }

    /* 상단 제목 이미지 */
    .content img.title {
      width: auto;
      max-width: 100%;         /* 원본 크기, 화면이 좁으면 줄어듦 */
      border-radius: 0;
      box-shadow: none;
    }

    /* 하단 학교 로고 */
    .content img.logo {
      width: 250px;            /* 로고 크기 — 여기 숫자 바꾸면 돼요 */
      max-width: 100%;
      border-radius: 0;
      box-shadow: none;
      margin-top: auto;        /* 배경 맨 아래쪽으로 붙이기 */
      margin-bottom: 40px;     /* 배경 아래 끝과의 간격 */
    }
    /* ===== 로딩 화면 (백야 × 연성대) ===== */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #ffe4ec;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .collab {
      display: flex;
      flex-direction: column;   /* 위아래 배치 */
      align-items: center;
      gap: 3vh;
      padding: 0 16px;
    }
    .collab img {
      display: block;
      height: auto;
      opacity: 0;
    }
    .collab .logo-top    { width: min(52vw, 250px); }   /* 백야 (위) */
    .collab .logo-bottom { width: min(63vw, 302px); }   /* 연성대 (아래) — 두 로고 높이 같게 */
    .collab .x {
      font-family: sans-serif;
      font-size: min(8vw, 44px);
      font-weight: 900;
      color: #222;
      opacity: 0;
      line-height: 1;
    }

    /* 1단계: 위아래에서 날아와서 가운데로 */
    #loader.enter .logo-top    { animation: fly-top    0.7s cubic-bezier(.2,.9,.3,1.15) forwards; }
    #loader.enter .logo-bottom { animation: fly-bottom 0.7s cubic-bezier(.2,.9,.3,1.15) forwards; }
    #loader.enter .x           { animation: pop-x 0.5s cubic-bezier(.3,1.6,.5,1) 0.55s forwards; }
    @keyframes fly-top {
      from { opacity: 0; transform: translateY(-60vh) rotate(-8deg); }
      to   { opacity: 1; transform: translateY(0)     rotate(0deg);  }
    }
    @keyframes fly-bottom {
      from { opacity: 0; transform: translateY(60vh) rotate(8deg); }
      to   { opacity: 1; transform: translateY(0)    rotate(0deg); }
    }
    @keyframes pop-x {
      0%   { opacity: 0; transform: scale(0) rotate(-90deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg);   }
    }

    /* 2단계: 살짝 움츠렸다가 화면 안으로 확 확대되며 사라짐 */
    #loader.zoom .collab { animation: zoom-in 0.75s cubic-bezier(.6,0,.9,.4) forwards; }
    @keyframes zoom-in {
      0%   { transform: scale(1);    opacity: 1; }
      25%  { transform: scale(0.88); opacity: 1; }
      100% { transform: scale(14);   opacity: 0; }
    }

    /* 3단계: 배경 걷히면서 본문 등장 */
    #loader.zoom { animation: bg-out 0.45s ease 0.45s forwards; }
    @keyframes bg-out {
      to { background-color: rgba(255, 228, 236, 0); }
    }
    #loader.hide { visibility: hidden; }

    @media (prefers-reduced-motion: reduce) {
      #loader * { animation-duration: 0.01s !important; animation-delay: 0s !important; }
    }
    /* ===== 지도 클릭 시 상세지도 (전체화면) ===== */
    .content img.map-thumb { cursor: zoom-in; }

    /* 지도 + 바로 아래 버튼 (폭 = 지도 폭) */
    .map-wrap {
      width: 100%;
      margin-top: 50px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    .map-wrap img.map-thumb {
      margin-top: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .map-btn {
      display: block;
      width: 100%;
      padding: 14px 0;
      border: none;
      background: #ff8fb3;
      color: #fff;
      font-family: sans-serif;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }
    .map-btn:hover { background: #ff79a5; }
    #mapModal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;      /* 상하 중앙 */
      justify-content: center;  /* 좌우 중앙 */
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      cursor: zoom-out;
    }
    #mapModal.open {
      opacity: 1;
      visibility: visible;
    }
    #mapModal img {
      display: block;
      max-width: 100vw;         /* 비율 유지하며 화면에 꽉 차게 */
      max-height: 100vh;
      max-height: 100dvh;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: scale(0.92);
      transition: transform 0.3s ease;
    }
    #mapModal.open img { transform: scale(1); }
    #mapModal .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: #222;
      font-size: 26px;
      line-height: 44px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 로딩 화면 -->
  <div id="loader">
    <div class="collab">
      <img class="logo-top"    src="백야.png" alt="백야 총학생회">
      <span class="x">×</span>
      <img class="logo-bottom" src="연성대.png" alt="연성대학교">
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="falling-bg" id="fallingBg"></div>

    <!-- 본문 내용 여기에 -->
    <main class="content">
      <img class="title" src="제목.png" alt="제목">
      <img src="1일차.png" alt="1일차">
      <img src="2일차.png" alt="2일차">
      <div class="map-wrap">
        <img class="map-thumb" id="mapThumb" src="지도.png" alt="지도 (누르면 크게 보기)">
        <button class="map-btn" id="mapBtn" type="button">상세지도 보기</button>
      </div>
      <img class="logo" src="로고.png" alt="학교 로고">
    </main>
  </div>

  <script>
    // ===== 여기 숫자만 바꾸면 돼요 =====
    const BG_IMAGE = "배경.png";   // 배경 이미지 파일명 (CSS의 url("배경.png")도 같이 바꿔주세요)
    const COUNT = 50;              // 떨어지는 오브젝트 개수
    const MIN_SIZE = 40;           // 최소 크기 (px)
    const MAX_SIZE = 80;           // 최대 크기 (px)
    const MIN_SPEED = 4;           // 가장 빠른 낙하 시간 (초)
    const MAX_SPEED = 8;          // 가장 느린 낙하 시간 (초)
    const IMAGES = [
      "씨디.png",
      "별.png",
      "하트.png",
      "디카.png",
      "이어폰.png",
      "엠피쓰리.png"
    ];
    // ====================================

    const stage = document.getElementById("stage");
    const bg = document.getElementById("fallingBg");
    const rand = (min, max) => Math.random() * (max - min) + min;

    // 1) 배경 이미지 원본 크기를 읽어서 무대 크기를 똑같이 맞춤
    const bgImg = new Image();
    // (최소 높이 = 배경 이미지 비율, 내용이 더 길면 그만큼 늘어남)
    function fitStage() {
      if (!bgImg.naturalWidth) return;
      stage.style.minHeight = stage.offsetWidth * bgImg.naturalHeight / bgImg.naturalWidth + "px";
    }
    bgImg.onload = () => {
      stage.style.maxWidth = bgImg.naturalWidth + "px";
      fitStage();
      updateHeight();
    };
    window.addEventListener("resize", fitStage);
    bgImg.src = BG_IMAGE;

    // 2) 무대 높이를 애니메이션에 전달 (창 크기 바뀌면 자동 갱신)
    function updateHeight() {
      stage.style.setProperty("--stage-h", stage.offsetHeight + "px");
    }
    new ResizeObserver(updateHeight).observe(stage);

    // 3) 떨어지는 오브젝트 랜덤 생성
    for (let i = 0; i < COUNT; i++) {
      const item = document.createElement("div");
      item.className = "item";

      const img = document.createElement("img");
      img.src = IMAGES[i % IMAGES.length];
      img.alt = "";
      item.appendChild(img);

      const size = rand(MIN_SIZE, MAX_SIZE);
      const duration = rand(MIN_SPEED, MAX_SPEED);

      item.style.width = size + "px";
      item.style.height = size + "px";
      item.style.left = rand(0, 95) + "%";
      item.style.animationDuration = duration + "s";
      item.style.animationDelay = -rand(0, duration) + "s";
      item.style.opacity = rand(0.7, 1);

      item.addEventListener("animationiteration", () => {
        item.style.left = rand(0, 95) + "%";
      });

      bg.appendChild(item);
    }
  </script>

  <script>
    // 로딩 화면: 로고 등장 → (페이지 다 불러오면) 확대되며 사라짐. 최대 8초 후엔 무조건 사라짐
    (function () {
      const HOLD_TIME = 1700;   // 로고 모인 뒤 확대 시작까지 최소 시간 (밀리초)
      const ZOOM_TIME = 900;    // 확대 + 배경 사라지는 시간
      const MAX_WAIT  = 8000;

      const loader = document.getElementById("loader");
      const logos = [...loader.querySelectorAll("img")];
      let pageLoaded = false, holdDone = false, finished = false;

      function finish() {
        if (finished) return;
        finished = true;
        loader.classList.add("enter", "zoom");
        setTimeout(() => loader.classList.add("hide"), ZOOM_TIME);
      }
      function tryFinish() { if (pageLoaded && holdDone) finish(); }

      // 로고 이미지 준비되면 등장 시작
      Promise.all(logos.map(img =>
        img.complete ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = r; })
      )).then(() => {
        loader.classList.add("enter");
        setTimeout(() => { holdDone = true; tryFinish(); }, HOLD_TIME);
      });

      window.addEventListener("load", () => { pageLoaded = true; tryFinish(); });
      setTimeout(finish, MAX_WAIT);
    })();
  </script>

  <!-- 상세지도 (지도 누르면 뜸) -->
  <div id="mapModal" role="dialog" aria-modal="true" aria-label="상세지도">
    <button class="close-btn" type="button" aria-label="닫기">×</button>
    <img src="상세지도.png" alt="상세지도">   <!-- 상세지도 파일 따로 있으면 여기 파일명만 바꾸면 돼요 -->
  </div>

  <script>
    // 지도 누르면 상세지도 열기 / 아무 데나 누르거나 ESC 누르면 닫기
    (function () {
      const thumb = document.getElementById("mapThumb");
      const modal = document.getElementById("mapModal");
      function openMap()  { modal.classList.add("open");    document.body.style.overflow = "hidden"; }
      function closeMap() { modal.classList.remove("open"); document.body.style.overflow = ""; }
      thumb.addEventListener("click", openMap);
      document.getElementById("mapBtn").addEventListener("click", openMap);
      modal.addEventListener("click", closeMap);
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeMap(); });
    })();
  </script>

</body>
</html>
