<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 페이지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #ffe4ec; /* 배경 이미지 바깥 여백 색 (연핑크) */
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ===== 배경 이미지 크기와 똑같은 무대 ===== */
    .stage {
      position: relative;
      width: 100%;             /* 화면이 이미지보다 작으면 비율 유지하며 줄어듦 */
      /* max-width, aspect-ratio 는 스크립트가 이미지 원본 크기로 자동 설정 */
      background-image: url("배경.png");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      overflow: hidden;        /* 오브젝트가 이미지 밖으로 안 나감 */
    }

    /* ===== 떨어지는 오브젝트 ===== */
    .falling-bg {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .item {
      position: absolute;
      top: -150px;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* --stage-h = 배경 이미지 높이 (스크립트가 자동 설정) */
    @keyframes fall {
      0%   { transform: translate(0, 0)                               rotate(0deg);   }
      25%  { transform: translate(20px,  calc(var(--stage-h) * 0.3))  rotate(90deg);  }
      50%  { transform: translate(-20px, calc(var(--stage-h) * 0.6))  rotate(180deg); }
      75%  { transform: translate(15px,  calc(var(--stage-h) * 0.9))  rotate(270deg); }
      100% { transform: translate(0,     calc(var(--stage-h) + 200px)) rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .item { animation: none !important; }
    }

    /* ===== 본문 (배경 이미지 위에 표시) ===== */
    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 100px 50px;      /* 양옆 마진 20px */
    }

    /* 본문 사진 */
    .content img {
      display: block;
      width: 100%;             /* 양옆 20px 빼고 꽉 차게 */
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    <div class="falling-bg" id="fallingBg"></div>

    <!-- 본문 내용 여기에 -->
    <main class="content">
      <img src="1일차.png" alt="1일차">
      <img src="2일차.png" alt="2일차">
      <img src="지도.jpg" alt="지도">
    </main>
  </div>

  <script>
    // ===== 여기 숫자만 바꾸면 돼요 =====
    const BG_IMAGE = "배경.png";   // 배경 이미지 파일명 (CSS의 url("배경.png")도 같이 바꿔주세요)
    const COUNT = 30;              // 떨어지는 오브젝트 개수
    const MIN_SIZE = 40;           // 최소 크기 (px)
    const MAX_SIZE = 80;           // 최대 크기 (px)
    const MIN_SPEED = 7;           // 가장 빠른 낙하 시간 (초)
    const MAX_SPEED = 15;          // 가장 느린 낙하 시간 (초)
    const IMAGES = [
      "씨디.png",
      "별.png",
      "하트.png",
      "디카.png",
      "이어폰.png",
      "엠피쓰리.png"
    ];
    // ====================================

    const stage = document.getElementById("stage");
    const bg = document.getElementById("fallingBg");
    const rand = (min, max) => Math.random() * (max - min) + min;

    // 1) 배경 이미지 원본 크기를 읽어서 무대 크기를 똑같이 맞춤
    const bgImg = new Image();
    bgImg.onload = () => {
      stage.style.maxWidth = bgImg.naturalWidth + "px";
      stage.style.aspectRatio = bgImg.naturalWidth + " / " + bgImg.naturalHeight;
      updateHeight();
    };
    bgImg.src = BG_IMAGE;

    // 2) 무대 높이를 애니메이션에 전달 (창 크기 바뀌면 자동 갱신)
    function updateHeight() {
      stage.style.setProperty("--stage-h", stage.offsetHeight + "px");
    }
    new ResizeObserver(updateHeight).observe(stage);

    // 3) 떨어지는 오브젝트 랜덤 생성
    for (let i = 0; i < COUNT; i++) {
      const item = document.createElement("div");
      item.className = "item";

      const img = document.createElement("img");
      img.src = IMAGES[i % IMAGES.length];
      img.alt = "";
      item.appendChild(img);

      const size = rand(MIN_SIZE, MAX_SIZE);
      const duration = rand(MIN_SPEED, MAX_SPEED);

      item.style.width = size + "px";
      item.style.height = size + "px";
      item.style.left = rand(0, 95) + "%";
      item.style.animationDuration = duration + "s";
      item.style.animationDelay = -rand(0, duration) + "s";
      item.style.opacity = rand(0.7, 1);

      item.addEventListener("animationiteration", () => {
        item.style.left = rand(0, 95) + "%";
      });

      bg.appendChild(item);
    }
  </script>

</body>
</html>
