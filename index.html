<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기록</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #ffe4ec; /* 연핑크 */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 40px;
      padding: 40px 16px;
    }

    img {
      display: block;
      max-width: 100%;
      width: 800px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <h1>양지대동제 일정표&부스배치도</h1>
  <img src="1일차.png" alt="1일차">
  <img src="2일차.png" alt="2일차">
  <img src="지도.jpg" alt="지도">
</body>
</html>
